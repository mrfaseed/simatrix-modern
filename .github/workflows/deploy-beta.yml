name: Deploy Beta to Hostinger

on:
  push:
    branches:
      - beta
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-beta-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build on GitHub & Deploy to Hostinger Beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          echo "Installing backend dependencies..."
          npm --prefix backend install --omit=dev
          echo "Installing frontend dependencies..."
          npm --prefix frontend install

      - name: Build Next.js Application on GitHub
        run: |
          echo "Compiling Next.js application on GitHub runner..."
          npm --prefix frontend run build
          node scripts/copy-standalone-assets.js
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL_BETA || 'https://beta.simatrixacademy.com' }}

      - name: Copy Built Artifacts to Hostinger Beta
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          source: "frontend/.next,frontend/public,frontend/package.json,backend,server.js,package.json,ecosystem.config.js,.htaccess"
          target: "${{ secrets.HOSTINGER_TARGET_DIR_BETA || '/home/u497440012/domains/simatrixacademy.com/public_html/beta' }}"
          overwrite: true
          strip_components: 0

      - name: Reload PM2 on Hostinger Beta
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script_stop: true
          script: |
            echo "=== Activating Beta Deployment on Hostinger ==="
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.npm-global/bin:$PATH"
            
            TARGET_DIR="${{ secrets.HOSTINGER_TARGET_DIR_BETA || '/home/u497440012/domains/simatrixacademy.com/public_html/beta' }}"
            cd "$TARGET_DIR" || exit 1
            
            # Install production dependencies for backend if missing
            npm --prefix backend install --omit=dev
            
            # Reload PM2 process on port 3000
            echo "Restarting simatrix-beta in PM2..."
            PORT=3000 BACKEND_PORT=5000 pm2 restart simatrix-beta --update-env || PORT=3000 BACKEND_PORT=5000 pm2 start server.js --name simatrix-beta
            pm2 save
            
            echo "=== Beta Deployment Completed Successfully ==="
