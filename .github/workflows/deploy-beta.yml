name: Deploy Beta to Hostinger

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: hostinger-beta-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build on GitHub & Deploy to Hostinger Beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          echo "Installing frontend dependencies..."
          npm --prefix frontend install

      - name: Build Next.js Application on GitHub
        run: |
          echo "Compiling Next.js application on GitHub runner..."
          npm --prefix frontend run build
          node scripts/copy-standalone-assets.js
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL_BETA || 'https://beta.simatrixacademy.com' }}

      - name: Copy Built Artifacts to Hostinger Beta
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          source: "frontend/.next,frontend/public,frontend/package.json,backend,index.php,server.js,package.json,ecosystem.config.js,.htaccess"
          target: "${{ secrets.HOSTINGER_TARGET_DIR_BETA || '/home/u497440012/domains/simatrixacademy.com/public_html/beta' }}"
          overwrite: true
          strip_components: 0

      - name: Reload PM2 on Hostinger Beta
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script_stop: false
          script: |
            echo "=== Activating Beta Deployment on Hostinger ==="
            set +e
            
            # Export direct paths to Node v20 and global binaries
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
            NODE_BIN="$HOME/.nvm/versions/node/v20.20.2/bin"
            export PATH="$NODE_BIN:$HOME/.npm-global/bin:$HOME/.local/bin:$PATH"
            
            # Ensure pm2 is installed
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Installing PM2 globally..."
              npm install -g pm2
            fi
            
            TARGET_DIR="${{ secrets.HOSTINGER_TARGET_DIR_BETA || '/home/u497440012/domains/simatrixacademy.com/public_html/beta' }}"
            mkdir -p "$TARGET_DIR/backend/data"
            chmod 775 "$TARGET_DIR/backend/data" 2>/dev/null || true
            cd "$TARGET_DIR" || exit 1
            
            # Restart PM2 on port 4000
            echo "Starting simatrix-beta in PM2 on port 4000..."
            pm2 delete simatrix-beta 2>/dev/null || true
            PORT=4000 pm2 start server.js --name simatrix-beta
            pm2 save
            
            echo "=== Beta Deployment Completed Successfully ==="
